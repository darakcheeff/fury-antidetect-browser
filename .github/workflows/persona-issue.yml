# An issue with a probe dump becomes a pull request with a persona.
#
# The manual path — checkout, cargo, `fury-detect persona`, personas-check,
# PR — is why the catalogue had 27 machines and two of them measured
# (docs/16, 3.4). This runs that path for the person who dropped a file into
# the form, and comments on their issue with the result either way.
name: persona from issue

# `labeled` is here because the first real submission (#5) arrived without the
# label: the form asks for `persona`, the label did not exist in the repository,
# and GitHub drops a label it cannot find without a word. Applying it by hand
# is a `labeled` event, not an `edited` one, and the job stayed skipped.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  convert:
    if: contains(github.event.issue.labels.*.name, 'persona')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The dump is either an attachment (a link GitHub wrote into the body)
      # or pasted as text. Nothing in the body is trusted beyond that: it is
      # parsed as JSON, converted by the same code the desktop runs, and
      # refused by the same validator.
      - name: extract the capture
        id: capture
        env:
          BODY: ${{ github.event.issue.body }}
          USER: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > body.md
          url=$(grep -oE 'https://github\.com/user-attachments/files/[0-9]+/[A-Za-z0-9._-]+\.json' body.md | head -1 || true)
          if [ -n "$url" ]; then
            curl -fsSL -o capture.json "$url"
          else
            # The first JSON object in the body: from its first "{" to the
            # last "}" — the form wraps the field in a heading and blank lines.
            python3 - <<'PY'
          import re, json, sys
          body = open("body.md", encoding="utf-8").read()
          i, j = body.find("{"), body.rfind("}")
          if i < 0 or j < 0: sys.exit("no JSON in the issue body")
          json.loads(body[i:j+1])
          open("capture.json", "w", encoding="utf-8").write(body[i:j+1])
          PY
          fi
          python3 -c 'import json; json.load(open("capture.json"))'
          # The form's fields, by their headings.
          # An empty optional field arrives as "_No response_".
          field() { awk -v h="### $1" '$0==h{f=1;next} /^### /{f=0} f' body.md | sed '/^\s*$/d' | head -1 | sed 's/^_No response_$//'; }
          echo "machine=$(field 'What machine is this?')" >> "$GITHUB_OUTPUT"
          echo "display=$(field 'Display')" >> "$GITHUB_OUTPUT"
          echo "shaping=$(field 'Anything that shapes the browser?')" >> "$GITHUB_OUTPUT"
          case "$(field 'Roughly how common is this machine?')" in
            common*)  echo "weight=0.02" >> "$GITHUB_OUTPUT" ;;
            unusual*) echo "weight=0.006" >> "$GITHUB_OUTPUT" ;;
            *)        echo "weight=0.01" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: convert and check
        id: convert
        env:
          USER: ${{ github.event.issue.user.login }}
          MACHINE: ${{ steps.capture.outputs.machine }}
          DISPLAY_KIND: ${{ steps.capture.outputs.display }}
          SHAPING: ${{ steps.capture.outputs.shaping }}
          WEIGHT: ${{ steps.capture.outputs.weight }}
          N: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          cargo build -q -p fury-detect
          if ! ./target/debug/fury-detect persona capture.json --weight "$WEIGHT" > persona.json 2> convert.log; then
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          id=$(python3 -c 'import json; print(json.load(open("persona.json"))["id"])')
          # Two people with the same machine: the second file is still that
          # machine, named apart. personas-check refuses a reused id.
          if [ -e "shared/personas/contributed/$id.json" ] || grep -q "id: \"$id\"" shared-rs/src/catalogue.rs; then
            id="$id-$N"
          fi
          desc="$MACHINE — $DISPLAY_KIND${SHAPING:+; $SHAPING}"
          python3 - "$id" "$USER" "$desc" <<'PY'
          import json, sys
          id, user, desc = sys.argv[1:]
          p = json.load(open("persona.json"))
          p["id"] = id
          p["contributed_by"] = user
          p["machine"] = desc
          # Attribution first, then the measurement, so a reader sees whose machine it is.
          ordered = {k: p[k] for k in ("id", "weight", "source", "contributed_by", "machine") if k in p}
          ordered.update({k: v for k, v in p.items() if k not in ordered})
          json.dump(ordered, open(f"shared/personas/contributed/{id}.json", "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          open(f"shared/personas/contributed/{id}.json", "a").write("\n")
          PY
          if ./target/debug/fury-detect personas-check > check.log 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "id=$id" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            cat check.log >> convert.log
          fi

      - name: open the pull request
        if: steps.convert.outputs.ok == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: persona/issue-${{ github.event.issue.number }}
          commit-message: |
            A machine for the catalogue: ${{ steps.convert.outputs.id }}

            ${{ steps.capture.outputs.machine }}, sent by @${{ github.event.issue.user.login }} in #${{ github.event.issue.number }}.
            Converted and checked by the persona-from-issue workflow.
          title: "persona: ${{ steps.convert.outputs.id }}"
          body: |
            `${{ steps.capture.outputs.machine }}` — ${{ steps.capture.outputs.display }}.
            Sent by @${{ github.event.issue.user.login }} in #${{ github.event.issue.number }}; converted with
            `fury-detect persona`, `personas-check` passes. Weight ${{ steps.capture.outputs.weight }} from the
            contributor's own guess — adjust from public distributions when merging (contributed/README.md).

            Closes #${{ github.event.issue.number }}.
          labels: persona
          add-paths: shared/personas/contributed/

      - name: tell the contributor
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.convert.outputs.ok }}
          ID: ${{ steps.convert.outputs.id }}
        with:
          script: |
            const fs = require('fs');
            const ok = process.env.OK === 'true';
            const log = fs.existsSync('convert.log') ? fs.readFileSync('convert.log', 'utf8').trim().slice(0, 3000) : '';
            const body = ok
              ? `Thank you. The machine is \`${process.env.ID}\`; a pull request with the persona is open under your name and will close this issue when merged.`
              : `The capture could not be turned into a persona. What the converter said:\n\n\`\`\`\n${log || 'no output'}\n\`\`\`\n\nMost often this is a dump from Fury or another modified browser rather than ordinary Chrome, or a file that was not the probe's JSON. Edit the issue with a new file and the workflow runs again.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
